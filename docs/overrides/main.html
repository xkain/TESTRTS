{% extends "base.html" %}

<!-- Bandeau tout en haut, au-dessus de l'en-tête, sur toutes les pages.
     Material le rend repliable : le visiteur peut le fermer, et le thème
     retient son choix tant que le texte ne change pas. -->
{% block announce %}
  <div class="mdx-announce">
    La <strong>v3.0.0</strong> est disponible —
    <a href="{{ 'v3/migration/' | url }}">passer de la v2.x à la v3</a>.
    Appareil encore en v2.x&nbsp;? La
    <a href="{{ 'v2/' | url }}">documentation v2.x</a> reste en ligne.
  </div>
{% endblock %}
