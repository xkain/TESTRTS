              - Services: v3/integrations/home-assistant/services.md
              - Événements: v3/integrations/home-assistant/evenements.md
              - Recettes d'automatisation: v3/integrations/home-assistant/automatisations.md
              - Diagnostics: v3/integrations/home-assistant/diagnostics.md
