      - MQTT ou Home Assistant ?: faq/mqtt-ou-home-assistant.md
      - L'interface ne répond plus: faq/interface-inaccessible.md

  - Aide:
      - aide/index.md

  # Pages valables pour les deux lignées : un
  # seul fichier publié, et un onglet qui le dit plutôt que deux copies à tenir
  # en phase. L'installateur web en fait partie mais reste sous « Outils en
  # ligne », où l'accueil et la page v3 pointent déjà.
  - Commun aux deux lignées:
      - commun/index.md
      - Composants: commun/composants.md
      - Journaux du port série: commun/journaux-port-serie.md
      - Home Assistant: commun/home-assistant.md

  - Outils en ligne:
      - outils/index.md
      - Installateur web: outils/installateur-web.md
      - Géolocalisation: outils/geolocalisation.md
