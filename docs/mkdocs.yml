      - Passer de la v2 à la v3: v3/migration.md
      - Matériel:
          - Boîtiers officiels: v3/materiel/boitiers-officiels.md
          - Contrôle des moteurs avec GPIO: v3/materiel/controle-moteurs-gpio.md
      - Mode Récupération: v3/recuperation.md
      - Général:
