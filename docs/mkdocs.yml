site_name: ESPSomfy-RTS
site_description: Documentation du firmware ESPSomfy-RTS — lignées v2.x et v3.x
site_url: https://xkain.github.io/ESPSomfy-RTS/guide/
site_author: xkain
copyright: >
  ESPSomfy-RTS — AGPL-3.0. Fork du firmware de
  <a href="https://github.com/rstrouse/ESPSomfy-RTS">rstrouse</a>.

repo_url: https://github.com/xkain/ESPSomfy-RTS
repo_name: xkain/ESPSomfy-RTS
# Pas de bouton « modifier cette page » : la documentation s'édite dans le dépôt.
edit_uri: ""

docs_dir: content
site_dir: site

theme:
  name: material
  variant: modern
  custom_dir: overrides
  language: fr
  favicon: assets/favicon.svg
  icon:
    logo: espsomfy/logo
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: fr

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/xkain/ESPSomfy-RTS
      name: Le dépôt du projet

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  # Les ancres du wiki (#la-bonne-méthode--la-réservation-dhcp) sont celles que
  # GitHub génère : accents conservés, ponctuation retirée. Le slugify par
  # défaut de Python-Markdown dépouille les accents et casserait tous les liens
  # internes importés ; celui de pymdownx reproduit la règle de GitHub.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  # Images citées depuis la racine de content/ (tools/rts_images) : plus de ../../..,
  # et dédoublement automatique en clair/sombre quand les deux variantes existent.
  - rts_images
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Zensical valide liens et ancres par défaut ; on l'écrit quand même, parce que
# c'est ce filet qui a rattrapé 4 ancres mortes dans les pages v3, et qu'un
# réglage tacite se perd.
validation:
  invalid_links: true
  invalid_link_anchors: true

nav:
  - Accueil: index.md

  - Documentation v2.x:
      - v2/index.md
      - Matériel:
          - Boîtiers officiels: v2/materiel/boitiers-preassembles.md
          - Contrôle des moteurs avec GPIO: v2/materiel/controle-moteurs-gpio.md
      - Installation:
          - Guide d'installation: v2/installation/guide.md
      - Tableau de bord: v2/tableau-de-bord.md
      - Configuration:
          - Options: v2/configuration/options.md
          - Sécurité: v2/configuration/securite.md
          - Firmware: v2/configuration/firmware.md
          - Mettre à jour: v2/configuration/mettre-a-jour.md
          - Connexion: v2/configuration/connexion.md
          - DHCP et IP statique: v2/configuration/dhcp-ip-statique.md
      - Radio:
          - Configurer la radio: v2/radio/configurer.md
          - Journaux radio: v2/radio/journaux.md
          - Balayage de fréquence: v2/radio/balayage-frequence.md
      - Somfy RTS:
          - Pièces (Rooms): v2/somfy/pieces.md
          - Équipements: v2/somfy/equipements.md
          - Groupes (Groups): v2/somfy/groupes.md
          - Répéteurs (Repeaters): v2/somfy/repeteurs.md
          - Télécommande virtuelle: v2/somfy/telecommande-virtuelle.md
      - Intégrations:
          - v2/integrations/index.md
          - MQTT: v2/integrations/mqtt.md
      - Maintenance:
          - Factory Reset: v2/maintenance/factory-reset.md
          - Anatomie du fichier de sauvegarde: v2/maintenance/anatomie-sauvegarde.md

  - Documentation v3.x:
