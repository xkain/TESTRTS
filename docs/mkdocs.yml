      - Réseau:
          - v3/reseau/index.md
          - Assistant de connexion: v3/reseau/assistant-de-connexion.md
          - DHCP et IP statique: v3/reseau/dhcp-ip-statique.md
          - Mot de passe du point d'accès: v3/reseau/mot-de-passe-point-d-acces.md
          - Paramètres MQTT: v3/reseau/parametres-mqtt.md
      - Gestion Somfy RTS:
          - Pièces (Rooms): v3/somfy/pieces.md
          - Équipements:
              - v3/somfy/equipements/index.md
              - Assistant de calibration: v3/somfy/equipements/calibration.md
