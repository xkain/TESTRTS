name: GitHub Pages

# Publie docs/ (site statique, cf. docs/index.html) sur GitHub Pages via le mécanisme officiel
# actions/deploy-pages, en y assemblant à chaque déploiement les binaires "factory" et les
# manifestes ESP Web Tools de la DERNIÈRE release publiée -- nécessaire pour que
# docs/installer.html puisse flasher depuis le navigateur : les assets de GitHub Releases
# (release-assets.githubusercontent.com) n'envoient aucun header Access-Control-Allow-Origin sur
# leur réponse finale (vérifié en conditions réelles : un fetch() cross-origin depuis
# xkain.github.io y échoue systématiquement, "Failed to fetch", quelle que soit l'URL utilisée,
# y compris via l'API qui a pourtant CORS sur sa redirection mais pas sur sa destination). Les
# binaires doivent donc être re-servis depuis CETTE MÊME origine Pages -- ce que fait ce workflow,
# en les téléchargeant côté serveur (aucune contrainte CORS pour `gh release download`) puis en
# les republiant avec le reste du site.
#
# Se redéclenche dans deux cas indépendants :
#   - un push sur main touchant docs/ (contenu du site modifié, firmware inchangé) ;
#   - la fin réussie d'une build déclenchée par une release (cf. .github/workflows/build.yaml).
# Dans les deux cas l'ensemble des versions recopiées est recalculé : un push docs/ isolé republie
# donc aussi le firmware le plus récent, sans avoir à faire persister d'état entre deux
# déploiements Pages (chaque déploiement via actions/upload-pages-artifact est un artifact
# autonome, rien n'est conservé de l'un à l'autre). Seul le CACHE des archives traverse les
# déploiements, et il ne sert qu'à s'épargner des téléchargements.
#
# Rien ne dépend plus des fragments de manifeste produits par la build : leurs artefacts expirent
# au bout de 90 jours, ce qui interdisait de republier une version un peu ancienne. Les images
# sont reconnues à leur nom, selon les conventions publiées.
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_run:
    workflows: ["ESPSomfy-RTS Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Ignore les fins de build qui ne concernent pas une release (push de dev, PR) et celles qui
    # ont échoué : rien de nouveau à publier, needs: [build] ferait sinon échouer aussi `deploy`.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Start from the static site
        run: |
          mkdir -p site/firmware site/manifests
          cp -r docs/. site/

      # Empaquette flash.js d'esp-web-tools (Transport/ESPLoader d'esptool-js et tout le reste)
      # en un seul fichier ESM autonome (tools/esp-flash-bundle/), pour que docs/js/installer.js
      # puisse piloter le moteur de flash bas niveau sans dépendre d'une conversion CDN à la
      # volée -- deux CDN différents (unpkg?module, esm.sh) ont chacun échoué différemment sur la
      # même dépendance transitive (atob-lite) en conditions réelles, l'un dès l'import, l'autre
      # en plein milieu d'un flash réel. Avec un vrai `npm install` + esbuild (donc une résolution
      # de dépendances normale, comme celle qu'utilise esp-web-tools pour publier son propre
      # install-button.js), cette même dépendance se résout en un simple appel à atob() natif.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build vendored flash.js bundle
        working-directory: tools/esp-flash-bundle
        run: |
          npm ci
          npm run build
          mkdir -p ../../site/js/vendor
          cp dist/esp-flash.js ../../site/js/vendor/esp-flash.js

      # Le tag le plus récent sert de CLÉ DE CACHE, pas de sélection : les images recopiées sont
      # choisies par le script ci-dessous. Une nouvelle release change donc la clé, `restore-keys`
      # ramène le cache du déploiement précédent (qui contient déjà toutes les autres versions), et
      # seule la nouvelle est téléchargée.
      - name: Locate latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::warning::Aucune release publiée pour l'instant -- site publié sans installateur web."
          fi

      # Sans ce cache, chaque push touchant docs/ retéléchargerait la trentaine d'archives (~34 Mo,
      # 33 s mesurées) alors que rien n'a bougé côté firmware. Avec, un déploiement qui ne change
      # que le site retombe à moins d'une seconde.
      - name: Restore mirrored firmware archives
        if: steps.rel.outputs.tag != ''
        uses: actions/cache@v4
        with:
          path: .fwcache
          key: fw-zips-v1-${{ steps.rel.outputs.tag }}
          restore-keys: fw-zips-v1-

      # Recopie les archives « factory » de plusieurs releases sous site/firmware/<tag>/<carte>.zip
      # et écrit site/manifests/index.json, que docs/js/installer.js lit pour peupler son sélecteur
      # de version. Cf. l'en-tête de tools/pages/mirror_releases.py pour le pourquoi de chaque
      # choix (CORS, archives plutôt qu'images extraites, reconnaissance par le nom).
      - name: Mirror release images onto the site
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/pages/mirror_releases.py \
            --repo "$GITHUB_REPOSITORY" --site site --cache .fwcache --nombre 5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
