name: ESPSomfy-RTS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

jobs:
  # =======================================================================
  # JOB 1 : Génération des images LittleFS (générique "en" + BOX "fr" dédiées)
  # =======================================================================
  littlefs:
    permissions: write-all
    name: LittleFS Image
    runs-on: ubuntu-latest
    outputs:
      safe_ref: ${{ steps.safe_ref.outputs.name }}

    steps:
      # github.ref_name n'est PAS un nom de branche/tag propre sur un pull_request : GitHub le
      # renseigne alors à "<numéro_pr>/merge" (ex: "2/merge"), slash compris -- utilisé tel quel
      # dans un nom de fichier, cp/upload-artifact l'interprètent comme un sous-dossier
      # inexistant ("ESPSomfyRTS_2/merge_filesystem.bin") et échouent. On calcule donc une fois
      # pour toutes une version assainie (slash -> tiret), réutilisée dans ce job ET dans le job
      # arduino (via needs.littlefs.outputs.safe_ref) pour que les deux jobs s'accordent sur le
      # même nom de fichier.
      - name: Compute safe ref name
        id: safe_ref
        run: |
          REF="${{ github.ref_name || 'dev' }}"
          echo "name=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      # Sur une release, la version de l'UI est prise du tag (ex: v3.0.0)
      # Cela écrit dans "data-dev/appversion" que ton minify_data.py va lire !
      - name: Inject release version into UI
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "${TAG#v}" > data-dev/appversion
          sed -i "s/appVersion = 'v[0-9][^']*'/appVersion = '${TAG}'/" data-dev/js/40-general.js
          grep -n "appVersion = " data-dev/js/40-general.js | head -1
          cat data-dev/appversion

      - name: Build LittleFS image (via esp32)
        run: pio run -e esp32 -t buildfs

      # Renommé selon la convention stricte [PROJET]_v[VERSION]_[TYPE]_[VARIANT].[ext] (TYPE=
      # "filesystem", ex-"littlefs") : Un seul unique filesystem pour tout le monde... SAUF les
      # boîtiers BOX (cf. blocs suivants). minify_data.py (_embedded_lang_for_env) choisit la
      # langue embarquée d'après les build_flags de L'ENVIRONNEMENT EN COURS DE BUILD : esp32
      # n'a ni HARDWARE_BOX_WIFI ni HARDWARE_BOX_ETH, donc ce filesystem-ci n'embarque que "en".
      - name: Rename filesystem to Standard Name
        run: cp .pio/build/esp32/littlefs.bin ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem.bin

      # Filesystem dédié aux boîtiers BOX (langue "fr" embarquée, cf. commentaire ci-dessus) --
      # requis par GitOTA.cpp::beginUpdate()/recoverFilesystem() qui, sur ces deux profils
      # matériels, téléchargent spécifiquement "..._filesystem_BOX.bin" (jamais le générique) pour
      # la mise à jour OTA du système de fichiers et pour la restauration après recovery. Un seul
      # nom d'asset pour les deux boîtiers : BOX-wifi et BOX-eth partagent le même filesystem
      # (minify_data.py::_embedded_lang_for_env ne les distingue pas, les deux donnent "fr"), donc
      # GitOTA.cpp demande le même fichier des deux côtés (cf. le #if commun HARDWARE_BOX_ETH ||
      # HARDWARE_BOX_WIFI dans setFirmwareFile/recoverFilesystem, comme déjà fait pour la langue
      # par défaut dans ConfigSettings.h). Sans cet asset, le firmware BOX (language="fr" par
      # défaut) se retrouve sans /locale/fr.json.gz : plus aucune traduction ne charge, seules les
      # clés brutes s'affichent -- exactement le comportement qu'on ne veut pas, déjà visible dès
      # le premier flash puisque le job "arduino" fusionne aussi ce même filesystem dans les images
      # factory des deux BOX (cf. matrix.fsname).
      - name: Build filesystem image (BOX, fr)
        run: pio run -e box_wifi -t buildfs

      - name: Rename filesystem to BOX Name
        run: cp .pio/build/box_wifi/littlefs.bin ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem_BOX.bin

      # Sauvegarde temporaire des 2 filesystems pour le job suivant (firmwares) -- un seul
      # artefact, actions/download-artifact restitue les fichiers tels quels (noms distincts) dans
      # le CWD du job "arduino", qui choisit celui qui lui revient via matrix.fsname.
      - name: Upload filesystem Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filesystem
          path: |
            ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem.bin
            ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem_BOX.bin
          retention-days: 5

      # Upload du filesystem générique sur la page de la Release
      - name: Upload filesystem to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem.bin
          asset_path: ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem.bin
          overwrite: true

      # Upload du filesystem BOX (fr) sur la page de la Release -- nom EXACT attendu par
      # GitOTA.cpp pour l'OTA du système de fichiers et le recovery sur ces deux profils matériels.
      - name: Upload BOX filesystem to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem_BOX.bin
          asset_path: ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem_BOX.bin
          overwrite: true

      # i18n Phase 1 : chaque langue du projet (embarquée dans data-dev/locale/ ou "à la
      # demande" dans locales/) est en plus attachée comme asset INDIVIDUEL de la release,
      # sous un nom versionné par le tag -- cf. package_langs.py. Nombre de langues variable
      # et inconnu à l'avance, d'où une boucle shell + `gh release upload` plutôt qu'un
      # step par asset (impossible à énumérer statiquement en YAML).
      - name: Package individual language assets
        if: github.event_name == 'release'
        run: python package_langs.py

      - name: Upload language assets to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in dist_langs/*.json.gz; do
            code=$(basename "$f" .json.gz)
            asset="ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_lang_${code}.json.gz"
            cp "$f" "$asset"
            gh release upload "${{ github.ref_name }}" "$asset" --clobber
          done

  # =======================================================================
  # JOB 2 : Compilation de chaque carte, image factory fusionnée et Uploads
  # =======================================================================
  arduino:
    permissions: write-all
    name: ${{ matrix.name }}
    needs: [littlefs]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # `env` sert aussi de `variant` au fragment de manifeste ESP Web Tools (cf. step
          # "Generate ESP Web Tools manifest fragment" plus bas), donc de nom de fichier
          # site/manifests/<variant>.json publié par pages.yml -- et docs/js/installer.js va
          # chercher ces noms EN DUR. Renommer un environnement ici impose donc de renommer l'`id`
          # correspondant dans DIY_BOARDS (installer.js), sans quoi le wizard web tombe sur un 404
          # silencieux. Les noms d'ASSETS de release (fwname/obname/obzip/fsname) sont en revanche
          # indépendants de `env` : ils ne bougent pas.
          - env: esp32
            name: ESP32
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_firmware_esp32.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32wrover
            name: ESP32-Wrover
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_firmware_esp32wrover.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32wrover.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32wrover.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32c3
            name: ESP32C3
            chip: ESP32-C3
            addr_bootloader: "0x0"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_firmware_esp32c3.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32c3.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32c3.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32s2
            name: ESP32S2
            chip: ESP32-S2
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_firmware_esp32s2.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s2.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s2.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32s3
            name: ESP32S3
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_littlefs: "0x770000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_firmware_esp32s3.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s3.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s3.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin

          # ---  LES DEUX BOX VENTE (4 Mo) --- fsname pointe sur le même filesystem dédié (langue
          # "fr" embarquée) construit par le job "littlefs" via l'env box_wifi -- PAS le générique
          # (esp32 / "en") utilisé par tous les autres boards ci-dessus. BOX-wifi et BOX-eth
          # partagent ce même asset "..._filesystem_BOX.bin" (cf. GitOTA.cpp, même regroupement
          # HARDWARE_BOX_ETH || HARDWARE_BOX_WIFI que pour la langue par défaut dans
          # ConfigSettings.h). Cf. commentaire détaillé sur le job "littlefs" (step "Build
          # filesystem image (BOX, fr)").
          - env: box_wifi
            name: BOX-Wifi
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_firmware_BOX_wifi_esp32.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_BOX_wifi_esp32.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_BOX_wifi_esp32.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem_BOX.bin
          - env: box_eth
            name: BOX-Ethernet
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_firmware_BOX_eth_esp32.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_BOX_eth_esp32.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_BOX_eth_esp32.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem_BOX.bin

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      # Récupère les images filesystem générées au Job 1 (générique + BOX-wifi + BOX-eth)
      - name: Get filesystem
        uses: actions/download-artifact@v4
        with:
          name: Filesystem

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      # Sur une release, FW_VERSION est pris du tag pour s'identifier correctement
      - name: Inject release version into firmware
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          sed -i "s/#define FW_VERSION \"[^\"]*\"/#define FW_VERSION \"${TAG}\"/" src/ConfigSettings.h
          grep -n "FW_VERSION" src/ConfigSettings.h | head -1

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Création de l'image de fusion factory (utilise l'offset filesystem propre à chaque carte,
      # et le filesystem propre à chaque carte via matrix.fsname -- générique partout SAUF les
      # deux BOX, qui embarquent leur propre filesystem "fr" dédié, cf. matrix.fsname plus haut)
      - name: ${{ matrix.name }} Image
        run: |
          python -m esptool --chip ${{ matrix.chip }} \
            merge-bin -o .pio/build/${{ matrix.env }}/${{ matrix.obname }} \
            ${{ matrix.addr_bootloader }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin \
            ${{ matrix.addr_littlefs }} ${{ matrix.fsname }}

      # Compression de l'image factory avec son nom d'archive propre -- matrix.obzip (SANS ".bin",
      # ex: "..._factory_esp32.zip") plutôt que "${{ matrix.obname }}.zip" : l'archive elle-même a
      # sa propre extension .zip, le ".bin" qu'elle contient n'a pas à apparaître deux fois dans le
      # nom du fichier téléchargé par l'utilisateur.
      - name: Compress factory image
        run: zip -j .pio/build/${{ matrix.env }}/${{ matrix.obzip }} .pio/build/${{ matrix.env }}/${{ matrix.obname }}

      # CAS 1 : Si c'est un PUSH de dev
      - name: Upload ${{ matrix.name }} (Dev Artifact)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/${{ matrix.obname }}
          retention-days: 5

      # CAS 2 : Si c'est une RELEASE (Firmware applicatif)
      - name: Upload firmware to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.fwname }}
          asset_path: .pio/build/${{ matrix.env }}/firmware.bin
          overwrite: true

      # CAS 2 suite : Si c'est une RELEASE (Image zip d'usine)
      - name: Upload factory image to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.obzip }}
          asset_path: .pio/build/${{ matrix.env }}/${{ matrix.obzip }}
          overwrite: true
          asset_content_type: application/zip

      # CAS 2 suite : fragment de manifeste ESP Web Tools pour ce board, préparé pour le wizard de
      # flash web (docs/installer.html) publié par .github/workflows/pages.yml.
      # chipFamily reprend TEL QUEL matrix.chip -- déjà exactement la valeur attendue par ESP Web
      # Tools -- plutôt que de le redéclarer dans une table de correspondance séparée côté
      # pages.yml : une seule source de vérité pour "quelle puce", ici, à côté de son usage esptool.
      # zipAsset pointe explicitement vers l'asset de Release à récupérer (cf. step précédent) :
      # pages.yml n'a donc pas à reconstruire ce nom depuis des conventions de nommage.
      #
      # offset EST TOUJOURS 0, quel que soit matrix.addr_bootloader : `esptool merge-bin` (utilisé
      # juste au-dessus pour fusionner bootloader/partitions/firmware/filesystem en une seule image)
      # démarre TOUJOURS son fichier de sortie à l'adresse flash absolue 0x0 en format raw (celui
      # utilisé ici), en comblant de 0xFF l'espace avant le premier segment réel -- il ne démarre
      # PAS à la plus basse adresse donnée (matrix.addr_bootloader) comme on l'a cru un temps. Un
      # offset=addr_bootloader (0x1000 pour ce board) décale toute l'image de 4 Ko et empêche le
      # ROM bootloader de retrouver son en-tête ("flash read err" en boucle au démarrage) --
      # confirmé en conditions réelles : le même .bin, flashé à 0x1000 via notre installateur,
      # boot-loope ; flashé à 0x0 via web.esphome.io (générique, même moteur ESP Web Tools), il
      # démarre normalement.
      #
      # PAS d'upload du binaire lui-même ici : les assets de Release GitHub (release-assets.
      # githubusercontent.com) ne renvoient aucun header Access-Control-Allow-Origin sur leur
      # réponse finale -- vérifié en conditions réelles, y compris via l'API (qui a pourtant CORS
      # sur sa redirection, mais pas sur la destination finale de celle-ci) : un fetch() cross-
      # origin depuis xkain.github.io y échoue donc systématiquement ("Failed to fetch"), quelle
      # que soit l'URL utilisée. pages.yml télécharge donc l'asset de Release ci-dessus lui-même
      # côté serveur (pas de CORS pour un `gh release download`) et le republie depuis SA PROPRE
      # origine Pages -- ce fragment ne transporte que la métadonnée, pas le binaire.
      - name: Generate ESP Web Tools manifest fragment
        if: github.event_name == 'release'
        run: |
          python3 -c "
          import json
          json.dump({
              'variant': '${{ matrix.env }}',
              'name': '${{ matrix.name }}',
              'chipFamily': '${{ matrix.chip }}',
              'offset': 0,
              'zipAsset': '${{ matrix.obzip }}',
          }, open('manifest-fragment-${{ matrix.env }}.json', 'w'), indent=2)
          "

      - name: Upload manifest fragment artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-${{ matrix.env }}
          path: manifest-fragment-${{ matrix.env }}.json
          retention-days: 90
