name: ESPSomfy-RTS Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Ignoré par GitHub sur un push de tag : une release v* se construit toujours.
    paths:
      - 'src/**'
      - 'install/**'
      - 'data-dev/**'
      - 'locales/**'
      - 'tools/**'
      - 'platformio.ini'
      - '*.csv'
      - '.github/workflows/build.yaml'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Seules les versions de dev s'annulent entre elles (la plus récente gagne). Tout le reste garde un groupe
# unique par run : le push du tag v* et l'événement release du même tag tournent en parallèle, et
# annuler l'un des deux priverait la release de ses assets.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'dev-build' || format('{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  # =======================================================================
  # JOB 1 : Génération de l'image LittleFS (vide, commune à toutes les cartes ; images par langue)
  # =======================================================================
  littlefs:
    permissions: write-all
    name: LittleFS Image
    runs-on: ubuntu-latest
    outputs:
      safe_ref: ${{ steps.safe_ref.outputs.name }}
      devbuild: ${{ steps.safe_ref.outputs.devbuild }}
      dev_ver: ${{ steps.dev_ver.outputs.ver }}

    steps:
      # github.ref_name n'est PAS un nom de branche/tag propre sur un pull_request : GitHub le
      # renseigne alors à "<numéro_pr>/merge" (ex: "2/merge"), slash compris -- utilisé tel quel
      # dans un nom de fichier, cp/upload-artifact l'interprètent comme un sous-dossier
      # inexistant ("ESPSomfyRTS_2/merge_filesystem.bin") et échouent. On calcule donc une fois
      # pour toutes une version assainie (slash -> tiret), réutilisée dans ce job ET dans le job
      # arduino (via needs.littlefs.outputs.safe_ref) pour que les deux jobs s'accordent sur le
      # même nom de fichier.
      # Version de dev = push sur main ou lancement manuel depuis main : les assets prennent alors le nom
      # du tag fixe "dev", celui que tools/pages/mirror_ota.py publie au catalogue OTA.
      - name: Compute safe ref name
        id: safe_ref
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "name=dev" >> "$GITHUB_OUTPUT"
            echo "devbuild=true" >> "$GITHUB_OUTPUT"
          else
            REF="${{ github.ref_name || 'dev' }}"
            echo "name=${REF//\//-}" >> "$GITHUB_OUTPUT"
            echo "devbuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      # Sur une release, la version de l'UI est prise du tag (ex: v3.0.0)
      # Cela écrit dans "data-dev/appversion" que ton build_data_image.py va lire !
      - name: Inject release version into UI
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "${TAG#v}" > data-dev/appversion
          sed -i "s/appVersion = 'v[0-9][^']*'/appVersion = '${TAG}'/" data-dev/js/40-general.js
          grep -n "appVersion = " data-dev/js/40-general.js | head -1
          cat data-dev/appversion

      # Version d'une version de dev : FW_VERSION du dépôt + sha court, ex. "v3.0.0-39e1e50". Plafonnée à
      # 14 caractères, ceux que retient appver_t::name (char[15]) : au-delà elle serait tronquée
      # sans bruit. Le sha est raccourci pour tenir, et la build échoue s'il en reste moins de 4.
      - name: Compute dev build version
        if: steps.safe_ref.outputs.devbuild == 'true'
        id: dev_ver
        run: |
          BASE=$(sed -n 's/^#define FW_VERSION "\(v[0-9.]*\)".*/\1/p' src/ConfigSettings.h)
          [ -n "$BASE" ] || { echo "::error::FW_VERSION introuvable dans src/ConfigSettings.h"; exit 1; }
          LEN=$((14 - ${#BASE} - 1))
          [ "$LEN" -ge 4 ] || { echo "::error::$BASE trop long pour un suffixe de sha"; exit 1; }
          VER="${BASE}-${GITHUB_SHA:0:$((LEN < 7 ? LEN : 7))}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Dev build version: $VER"

      - name: Inject dev build version into UI
        if: steps.safe_ref.outputs.devbuild == 'true'
        run: |
          VER="${{ steps.dev_ver.outputs.ver }}"
          echo "${VER#v}" > data-dev/appversion
          sed -i "s/appVersion = 'v[0-9][^']*'/appVersion = '${VER}'/" data-dev/js/40-general.js
          grep -n "appVersion = " data-dev/js/40-general.js | head -1

      - name: Build LittleFS image (via esp32)
        run: pio run -e esp32 -t buildfs

      # Renommé selon la convention stricte [PROJET]_v[VERSION]_[TYPE]_[VARIANT].[ext] (TYPE=
      # "filesystem", ex-"littlefs"). Image vide, commune à toutes les cartes 4 Mo, BOX comprises :
      # la langue d'usine est compilée dans l'application (cf. build_data_image.py).
      - name: Rename filesystem to Standard Name
        run: cp .pio/build/esp32/littlefs.bin ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem.bin

      - name: Build per-language filesystem images (4 MB)
        if: github.event_name == 'release'
        run: |
          mkdir -p fs_langs
          for code in $(python3 -c "import json; print(' '.join(sorted(json.load(open('locales/manifest.json'))['langs'])))"); do
            [ "$code" = "en" ] && continue
            ESPSOMFY_EXTRA_LANG="$code" pio run -e esp32 -t buildfs
            cp .pio/build/esp32/littlefs.bin "ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_fs_${code}_4mb.bin"
            zip -j "fs_langs/ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_fs_${code}_4mb.zip" \
              "ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_fs_${code}_4mb.bin"
          done

      - name: Write language filesystem descriptor
        if: github.event_name == 'release'
        run: |
          python3 - "${{ steps.safe_ref.outputs.name }}" <<'EOF'
          import csv, json, sys
          tag = sys.argv[1]
          def spiffs_offset(path):
              for row in csv.reader(open(path)):
                  if row and row[0].strip() == "spiffs":
                      return row[3].strip()
          cat = json.load(open("locales/manifest.json"))["langs"]
          langs = sorted(c for c in cat if c != "en")
          desc = {
              "offsets": {"4mb": spiffs_offset("partitions_common_4mb.csv")},
              "natives": {c: cat[c].get("native", c) for c in langs},
              "langs": {c: {"4mb": f"ESPSomfyRTS_{tag}_fs_{c}_4mb.zip"} for c in langs},
          }
          with open(f"fs_langs/ESPSomfyRTS_{tag}_fs_langs.json", "w") as f:
              json.dump(desc, f, indent=1)
          EOF

      - name: Upload language filesystem images to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" fs_langs/* --clobber

      # ATTENTION si un filesystem doit un jour être retiré de la liste ci-dessous : `path:` est une
      # chaîne multi-ligne, pas du YAML. Un "#" n'y commente rien et serait transmis tel quel comme
      # chemin à chercher par actions/upload-artifact. Retirer la ligne, ne pas la commenter.
      # Sauvegarde temporaire du filesystem pour le job suivant (firmwares), qui le restitue dans
      # son CWD et le désigne via matrix.fsname.
      - name: Upload filesystem Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Filesystem
          path: |
            ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_filesystem.bin
          retention-days: 5

      # Les filesystems ne sont plus publiés à part : l'interface est compilée dans le firmware, une
      # mise à jour n'écrit que l'application (cf. tools/pages/mirror_ota.py), et le filesystem est
      # déjà dans l'image factory.
      # Les langues, si : le relais automatique les lit sur raw.githubusercontent.com, mais c'est
      # dans la release qu'un utilisateur va chercher le fichier à importer à la main (mode AP sans
      # Internet). Un asset par langue, versionné par le tag -- cf. package_langs.py. Nombre de
      # langues variable, d'où une boucle shell + `gh release upload` plutôt qu'un step par asset.
      - name: Package individual language assets
        if: github.event_name == 'release'
        run: python tools/lang/package_langs.py

      - name: Upload language assets to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in dist_langs/*.json.gz; do
            code=$(basename "$f" .json.gz)
            asset="ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_lang_${code}.json.gz"
            cp "$f" "$asset"
            gh release upload "${{ github.ref_name }}" "$asset" --clobber
          done

      - name: Package language assets (dev build)
        if: steps.safe_ref.outputs.devbuild == 'true'
        run: |
          python tools/lang/package_langs.py
          mkdir -p devbuild
          for f in dist_langs/*.json.gz; do
            cp "$f" "devbuild/ESPSomfyRTS_dev_lang_$(basename "$f" .json.gz).json.gz"
          done

      - name: Upload language assets (dev build)
        if: steps.safe_ref.outputs.devbuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: devbuild-lang
          path: devbuild/
          retention-days: 5

  # =======================================================================
  # JOB 2 : Compilation de chaque carte, image factory fusionnée et Uploads
  # =======================================================================
  arduino:
    permissions: write-all
    name: ${{ matrix.name }}
    needs: [littlefs]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # `env` sert aussi de `variant` au fragment de manifeste ESP Web Tools (cf. step
          # "Generate ESP Web Tools manifest fragment" plus bas), donc de nom de fichier
          # site/manifests/<variant>.json publié par pages.yml -- et online/js/installer.js va
          # chercher ces noms EN DUR. Renommer un environnement ici impose donc de renommer l'`id`
          # correspondant dans DIY_BOARDS (installer.js), sans quoi le wizard web tombe sur un 404
          # silencieux. Les noms d'ASSETS de release (fwname/obname/obzip/fsname) sont en revanche
          # indépendants de `env` : ils ne bougent pas.
          - env: esp32
            install: esp32
            name: ESP32
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32wrover
            install: esp32
            name: ESP32-Wrover
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32wrover.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32wrover.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32wrover.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32c3
            install: esp32c3
            name: ESP32C3
            chip: ESP32-C3
            addr_bootloader: "0x0"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32c3.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32c3.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32c3.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32s2
            install: esp32s2
            name: ESP32S2
            chip: ESP32-S2
            addr_bootloader: "0x1000"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32s2.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s2.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s2.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: esp32s3
            install: esp32s3
            name: ESP32S3
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32s3.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s3.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32s3.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin

          # --- ESP32-C6 --- addr_bootloader 0x0 comme sur toutes les puces RISC-V et les S3.
          - env: esp32c6
            install: esp32c6
            name: ESP32C6
            chip: ESP32-C6
            addr_bootloader: "0x0"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32c6.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32c6.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32c6.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin

          # ---  LES DEUX BOX VENTE (4 Mo) --- même filesystem vide que les autres cartes 4 Mo : leur
          # "fr" d'usine est compilé dans l'application.
          - env: box_wifi
            install: esp32
            name: BOX-Wifi
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32_BOX_wifi.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32_BOX_wifi.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32_BOX_wifi.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin
          - env: box_eth
            install: esp32
            name: BOX-Ethernet
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x3B0000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_ota_esp32_BOX_eth.bin
            obname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32_BOX_eth.bin
            obzip: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_factory_esp32_BOX_eth.zip
            fsname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_filesystem.bin

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      # Récupère l'image filesystem générée au Job 1
      - name: Get filesystem
        uses: actions/download-artifact@v4
        with:
          name: Filesystem

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # zopfli et esbuild compressent l'interface compilée dans le firmware
      # (build_data_image.py::_write_web_assets_header) : ~25 Ko d'application de moins qu'avec
      # gzip -9 seul. Sans eux le build passe quand même, en le signalant.
      - name: Install PlatformIO, esptool and zopfli
        run: pip install platformio esptool zopfli

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install esbuild
        working-directory: tools/esp-flash-bundle
        run: npm ci

      # Sur une release, FW_VERSION est pris du tag pour s'identifier correctement
      - name: Inject release version into firmware
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          sed -i "s/#define FW_VERSION \"[^\"]*\"/#define FW_VERSION \"${TAG}\"/" src/ConfigSettings.h
          grep -n "FW_VERSION" src/ConfigSettings.h | head -1

      - name: Inject dev build version into firmware
        if: needs.littlefs.outputs.devbuild == 'true'
        run: |
          VER="${{ needs.littlefs.outputs.dev_ver }}"
          sed -i "s/#define FW_VERSION \"[^\"]*\"/#define FW_VERSION \"${VER}\"\n#define FW_RELEASE_TAG \"dev\"/" src/ConfigSettings.h
          grep -n "FW_VERSION\|FW_RELEASE_TAG" src/ConfigSettings.h | head -3

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Une image par famille de puce (matrix.install), écrite à l'adresse de la partition factory.
      - name: Build install mode
        run: pio run -d install -e ${{ matrix.install }}

      # Image factory : adresses lues dans la table, et une otadata qui désigne app0. Sans elle, une
      # carte fraîchement flashée démarrerait sur le Mode installation au lieu du firmware.
      - name: ${{ matrix.name }} Image
        run: |
          read OTADATA INSTALL APP0 < <(python3 tools/factory_layout.py partitions_common_4mb.csv otadata.bin)
          python -m esptool --chip ${{ matrix.chip }} \
            merge-bin -o .pio/build/${{ matrix.env }}/${{ matrix.obname }} \
            ${{ matrix.addr_bootloader }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            $OTADATA otadata.bin \
            $INSTALL install/.pio/build/${{ matrix.install }}/firmware.bin \
            $APP0 .pio/build/${{ matrix.env }}/firmware.bin \
            ${{ matrix.addr_littlefs }} ${{ matrix.fsname }}

      # Compression de l'image factory avec son nom d'archive propre -- matrix.obzip (SANS ".bin",
      # ex: "..._factory_esp32.zip") plutôt que "${{ matrix.obname }}.zip" : l'archive elle-même a
      # sa propre extension .zip, le ".bin" qu'elle contient n'a pas à apparaître deux fois dans le
      # nom du fichier téléchargé par l'utilisateur.
      - name: Compress factory image
        run: zip -j .pio/build/${{ matrix.env }}/${{ matrix.obzip }} .pio/build/${{ matrix.env }}/${{ matrix.obname }}

      # CAS 1 : Si c'est un PUSH de dev
      - name: Upload ${{ matrix.name }} (Dev Artifact)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/${{ matrix.obname }}
          retention-days: 5

      # CAS 1 bis : version de dev. Rien n'est publié ici : le job "devbuild" ne publie qu'une fois TOUTES
      # les cartes construites, pour que le catalogue ne mélange jamais deux builds différents.
      - name: Stage ${{ matrix.name }} dev build assets
        if: needs.littlefs.outputs.devbuild == 'true'
        run: |
          mkdir -p devbuild
          cp .pio/build/${{ matrix.env }}/firmware.bin devbuild/${{ matrix.fwname }}
          cp install/.pio/build/${{ matrix.install }}/firmware.bin devbuild/$(echo "${{ matrix.fwname }}" | sed 's/_ota_/_rescue_/')
          cp .pio/build/${{ matrix.env }}/${{ matrix.obzip }} devbuild/

      - name: Upload ${{ matrix.name }} dev build assets
        if: needs.littlefs.outputs.devbuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: devbuild-${{ matrix.env }}
          path: devbuild/
          retention-days: 5

      - name: Upload ${{ matrix.name }} ELF
        uses: actions/upload-artifact@v4
        with:
          name: elf-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.elf
          retention-days: 90

      - name: Upload ELF to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(echo "${{ matrix.fwname }}" | sed 's/_ota_/_elf_/; s/\.bin$/.elf/')
          cp .pio/build/${{ matrix.env }}/firmware.elf "$NAME"
          gh release upload "${{ github.ref_name }}" "$NAME" --clobber

      # CAS 2 : Si c'est une RELEASE (Firmware applicatif)
      - name: Upload firmware to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.fwname }}
          asset_path: .pio/build/${{ matrix.env }}/firmware.bin
          overwrite: true

      # CAS 2 suite : le Mode installation de cette carte, que l'appareil remplace par le réseau
      # (/updateInstall) quand son identifiant diffère de celui du catalogue.
      - name: Upload install mode to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(echo "${{ matrix.fwname }}" | sed 's/_ota_/_rescue_/')
          cp install/.pio/build/${{ matrix.install }}/firmware.bin "$NAME"
          gh release upload "${{ github.ref_name }}" "$NAME" --clobber

      # CAS 2 suite : Si c'est une RELEASE (Image zip d'usine)
      - name: Upload factory image to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.obzip }}
          asset_path: .pio/build/${{ matrix.env }}/${{ matrix.obzip }}
          overwrite: true
          asset_content_type: application/zip

      # CAS 2 suite : fragment de manifeste ESP Web Tools pour ce board, préparé pour le wizard de
      # flash web (online/installer.html) publié par .github/workflows/pages.yml.
      # chipFamily reprend TEL QUEL matrix.chip -- déjà exactement la valeur attendue par ESP Web
      # Tools -- plutôt que de le redéclarer dans une table de correspondance séparée côté
      # pages.yml : une seule source de vérité pour "quelle puce", ici, à côté de son usage esptool.
      # zipAsset pointe explicitement vers l'asset de Release à récupérer (cf. step précédent) :
      # pages.yml n'a donc pas à reconstruire ce nom depuis des conventions de nommage.
      #
      # offset EST TOUJOURS 0, quel que soit matrix.addr_bootloader : `esptool merge-bin` (utilisé
      # juste au-dessus pour fusionner bootloader/partitions/firmware/filesystem en une seule image)
      # démarre TOUJOURS son fichier de sortie à l'adresse flash absolue 0x0 en format raw (celui
      # utilisé ici), en comblant de 0xFF l'espace avant le premier segment réel -- il ne démarre
      # PAS à la plus basse adresse donnée (matrix.addr_bootloader) comme on l'a cru un temps. Un
      # offset=addr_bootloader (0x1000 pour ce board) décale toute l'image de 4 Ko et empêche le
      # ROM bootloader de retrouver son en-tête ("flash read err" en boucle au démarrage) --
      # confirmé en conditions réelles : le même .bin, flashé à 0x1000 via notre installateur,
      # boot-loope ; flashé à 0x0 via web.esphome.io (générique, même moteur ESP Web Tools), il
      # démarre normalement.
      #
      # PAS d'upload du binaire lui-même ici : les assets de Release GitHub (release-assets.
      # githubusercontent.com) ne renvoient aucun header Access-Control-Allow-Origin sur leur
      # réponse finale -- vérifié en conditions réelles, y compris via l'API (qui a pourtant CORS
      # sur sa redirection, mais pas sur la destination finale de celle-ci) : un fetch() cross-
      # origin depuis xkain.github.io y échoue donc systématiquement ("Failed to fetch"), quelle
      # que soit l'URL utilisée. pages.yml télécharge donc l'asset de Release ci-dessus lui-même
      # côté serveur (pas de CORS pour un `gh release download`) et le republie depuis SA PROPRE
      # origine Pages -- ce fragment ne transporte que la métadonnée, pas le binaire.
      - name: Generate ESP Web Tools manifest fragment
        if: github.event_name == 'release'
        run: |
          python3 -c "
          import json
          json.dump({
              'variant': '${{ matrix.env }}',
              'name': '${{ matrix.name }}',
              'chipFamily': '${{ matrix.chip }}',
              'offset': 0,
              'zipAsset': '${{ matrix.obzip }}',
          }, open('manifest-fragment-${{ matrix.env }}.json', 'w'), indent=2)
          "

      - name: Upload manifest fragment artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-${{ matrix.env }}
          path: manifest-fragment-${{ matrix.env }}.json
          retention-days: 90

  # =======================================================================
  # JOB 3 : Publication de la pré-release "dev" (push sur main / lancement manuel)
  # =======================================================================
  # Une seule pré-release au tag fixe "dev", mise à jour sur place : tag déplacé sur le commit,
  # assets remplacés. Jamais supprimée puis recréée, ce qui notifierait les abonnés du dépôt à chaque
  # push. Créée avec le GITHUB_TOKEN, elle ne déclenche ni ce workflow (pas de build "release" au tag
  # dev) ni pages.yml, qui ne recopie de toute façon que la dernière release publiée.
  devbuild:
    name: Publish dev build
    needs: [littlefs, arduino]
    if: needs.littlefs.outputs.devbuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get dev build assets
        uses: actions/download-artifact@v4
        with:
          pattern: devbuild-*
          path: assets
          merge-multiple: true

      # La note s'affiche aussi dans l'interface (parseMarkdown, 95-firmware.js). Les changements
      # passent par la page de comparaison GitHub plutôt que par une liste filtrée ici.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.littlefs.outputs.dev_ver }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          SHORT="${GITHUB_SHA:0:7}"
          {
            echo "**Development build of \`main\`**, commit [\`$SHORT\`](https://github.com/$REPO/commit/$GITHUB_SHA) ($VER)"
            echo
            echo "Built automatically and never tested. Install it only if you accept that the device may stop working and need a USB reflash."
            LAST=$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null || true)
            if [ -n "$LAST" ]; then
              echo
              echo "[Changes since $LAST](https://github.com/$REPO/compare/$LAST...$SHORT)"
            fi
          } > notes.md
          cat notes.md

      - name: Publish dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.littlefs.outputs.dev_ver }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          TITLE="dev - $VER"
          # Tag déplacé AVANT toute création : un tag dev orphelin ferait sinon ignorer --target.
          gh api -X PATCH "repos/$REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA" >/dev/null
          # Recréée à chaque build plutôt qu'éditée : `gh release edit` garde la date de PREMIÈRE
          # publication, et la pré-release s'affichait « publiée il y a deux semaines » au-dessus de
          # fichiers de la veille. La suppression emporte aussi les assets qu'un build ne produit plus
          # (--clobber remplace mais ne retire jamais). --cleanup-tag n'est PAS passé : le tag vient
          # d'être déplacé sur ce commit et doit survivre à la suppression de la release.
          gh release delete dev --repo "$REPO" --yes 2>/dev/null || true
          gh release create dev --repo "$REPO" --title "$TITLE" --notes-file notes.md --prerelease --latest=false
          ls -l assets
          gh release upload dev --repo "$REPO" assets/* --clobber
