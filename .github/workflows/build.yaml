name: ESPSomfy-RTS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

jobs:
  # =======================================================================
  # JOB 1 : Génération du LittleFS UNIQUE
  # =======================================================================
  littlefs:
    permissions: write-all
    name: LittleFS Image
    runs-on: ubuntu-latest

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build LittleFS image (via esp32dev)
        run: pio run -e esp32dev -t buildfs

      # Renommé selon ta règle stricte : Un seul unique LittleFS pour tout le monde
      - name: Rename LittleFS to Standard Name
        run: cp .pio/build/esp32dev/littlefs.bin ESPSomfyRTS_${{ github.ref_name || 'dev' }}_littlefs.bin

      # Sauvegarde temporaire du LittleFS pour le job suivant (firmwares)
      - name: Upload LittleFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleFS
          path: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_littlefs.bin
          retention-days: 5

      # Upload du LittleFS UNIQUE sur la page de la Release
      - name: Upload LittleFS to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ESPSomfyRTS_${{ github.ref_name }}_littlefs.bin
          asset_path: ESPSomfyRTS_${{ github.ref_name }}_littlefs.bin
          overwrite: true

  # =======================================================================
  # JOB 2 : Compilation de chaque carte, Onboard fusionné et Uploads
  # =======================================================================
  arduino:
    permissions: write-all
    name: ${{ matrix.name }}
    needs: [littlefs]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev
            name: ESP32
            chip: ESP32
            addr_bootloader: "0x1000"
            fwname: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_esp32.bin
            obname: ESPSomfyRTS_onboard_${{ github.ref_name || 'dev' }}_esp32.bin
          - env: esp32wrover
            name: ESP32-Wrover
            chip: ESP32
            addr_bootloader: "0x1000"
            fwname: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_esp32wrover.bin
            obname: ESPSomfyRTS_onboard_${{ github.ref_name || 'dev' }}_esp32wrover.bin
          - env: esp32c3
            name: ESP32C3
            chip: ESP32-C3
            addr_bootloader: "0x0"
            fwname: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_esp32c3.bin
            obname: ESPSomfyRTS_onboard_${{ github.ref_name || 'dev' }}_esp32c3.bin
          - env: esp32s2
            name: ESP32S2
            chip: ESP32-S2
            addr_bootloader: "0x1000"
            fwname: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_esp32s2.bin
            obname: ESPSomfyRTS_onboard_${{ github.ref_name || 'dev' }}_esp32s2.bin
          - env: esp32s3
            name: ESP32S3
            chip: ESP32-S3
            addr_bootloader: "0x0"
            fwname: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_esp32s3.bin
            obname: ESPSomfyRTS_onboard_${{ github.ref_name || 'dev' }}_esp32s3.bin

          # --- TES DEUX MATÉRIELS LEBONCOIN ---
          - env: lbc_wifi
            name: LBC-Wifi
            chip: ESP32
            addr_bootloader: "0x1000"
            fwname: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_LBC_wifi_esp32.bin
            obname: ESPSomfyRTS_onboard_${{ github.ref_name || 'dev' }}_LBC_wifi_esp32.bin
          - env: lbc_eth
            name: LBC-Ethernet
            chip: ESP32
            addr_bootloader: "0x1000"
            fwname: ESPSomfyRTS_${{ github.ref_name || 'dev' }}_LBC_eth_esp32.bin
            obname: ESPSomfyRTS_onboard_${{ github.ref_name || 'dev' }}_LBC_eth_esp32.bin

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      # Récupère l'image LittleFS unique générée au Job 1
      - name: Get LittleFS
        uses: actions/download-artifact@v4
        with:
          name: LittleFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Création de l'image de fusion onboard (utilise le fichier LittleFS unique téléchargé)
      - name: ${{ matrix.name }} Image
        run: |
          python -m esptool --chip ${{ matrix.chip }} \
            merge-bin -o .pio/build/${{ matrix.env }}/${{ matrix.obname }} \
            ${{ matrix.addr_bootloader }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin \
            0x290000 ESPSomfyRTS_${{ github.ref_name || 'dev' }}_littlefs.bin

      # Compression de l'image onboard avec son nom d'archive propre
      - name: Compress onboard image
        run: zip -j .pio/build/${{ matrix.env }}/${{ matrix.obname }}.zip .pio/build/${{ matrix.env }}/${{ matrix.obname }}

      # CAS 1 : Si c'est un PUSH de dev
      - name: Upload ${{ matrix.name }} (Dev Artifact)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/${{ matrix.obname }}
          retention-days: 5

      # CAS 2 : Si c'est une RELEASE (Firmware applicatif)
      - name: Upload firmware to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.fwname }}
          asset_path: .pio/build/${{ matrix.env }}/firmware.bin
          overwrite: true

      # CAS 2 suite : Si c'est une RELEASE (Image zip d'usine)
      - name: Upload onboard image to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.obname }}.zip
          asset_path: .pio/build/${{ matrix.env }}/${{ matrix.obname }}.zip
          overwrite: true
          asset_content_type: application/zip
