name: ESPSomfy-RTS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

jobs:
  # =======================================================================
  # JOB 1 : Génération du LittleFS UNIQUE
  # =======================================================================
  littlefs:
    permissions: write-all
    name: LittleFS Image
    runs-on: ubuntu-latest
    outputs:
      safe_ref: ${{ steps.safe_ref.outputs.name }}

    steps:
      # github.ref_name n'est PAS un nom de branche/tag propre sur un pull_request : GitHub le
      # renseigne alors à "<numéro_pr>/merge" (ex: "2/merge"), slash compris -- utilisé tel quel
      # dans un nom de fichier, cp/upload-artifact l'interprètent comme un sous-dossier
      # inexistant ("ESPSomfyRTS_2/merge_littlefs.bin") et échouent. On calcule donc une fois
      # pour toutes une version assainie (slash -> tiret), réutilisée dans ce job ET dans le job
      # arduino (via needs.littlefs.outputs.safe_ref) pour que les deux jobs s'accordent sur le
      # même nom de fichier.
      - name: Compute safe ref name
        id: safe_ref
        run: |
          REF="${{ github.ref_name || 'dev' }}"
          echo "name=${REF//\//-}" >> "$GITHUB_OUTPUT"

      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      # Sur une release, la version de l'UI est prise du tag (ex: v3.0.0)
      # Cela écrit dans "data-dev/appversion" que ton minify_data.py va lire !
      - name: Inject release version into UI
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "${TAG#v}" > data-dev/appversion
          sed -i "s/appVersion = 'v[0-9][^']*'/appVersion = '${TAG}'/" data-dev/index.js
          grep -n "appVersion = " data-dev/index.js | head -1
          cat data-dev/appversion

      - name: Build LittleFS image (via esp32dev)
        run: pio run -e esp32dev -t buildfs

      # Renommé selon ta règle stricte : Un seul unique LittleFS pour tout le monde
      - name: Rename LittleFS to Standard Name
        run: cp .pio/build/esp32dev/littlefs.bin ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_littlefs.bin

      # Sauvegarde temporaire du LittleFS pour le job suivant (firmwares)
      - name: Upload LittleFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleFS
          path: ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_littlefs.bin
          retention-days: 5

      # Upload du LittleFS UNIQUE sur la page de la Release
      - name: Upload LittleFS to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_littlefs.bin
          asset_path: ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_littlefs.bin
          overwrite: true

      # i18n Phase 1 : chaque langue du projet (embarquée dans data-dev/locale/ ou "à la
      # demande" dans locales/) est en plus attachée comme asset INDIVIDUEL de la release,
      # sous un nom versionné par le tag -- cf. package_langs.py. Nombre de langues variable
      # et inconnu à l'avance, d'où une boucle shell + `gh release upload` plutôt qu'un
      # step par asset (impossible à énumérer statiquement en YAML).
      - name: Package individual language assets
        if: github.event_name == 'release'
        run: python package_langs.py

      - name: Upload language assets to Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for f in dist_langs/*.json.gz; do
            code=$(basename "$f" .json.gz)
            asset="ESPSomfyRTS_${{ steps.safe_ref.outputs.name }}_lang_${code}.json.gz"
            cp "$f" "$asset"
            gh release upload "${{ github.ref_name }}" "$asset" --clobber
          done

  # =======================================================================
  # JOB 2 : Compilation de chaque carte, Onboard fusionné et Uploads
  # =======================================================================
  arduino:
    permissions: write-all
    name: ${{ matrix.name }}
    needs: [littlefs]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev
            name: ESP32
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_esp32.bin
            obname: ESPSomfyRTS_onboard_${{ needs.littlefs.outputs.safe_ref }}_esp32.bin
            latestname: ESPSomfyRTS_onboard_esp32.bin
          - env: esp32wrover
            name: ESP32-Wrover
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_esp32wrover.bin
            obname: ESPSomfyRTS_onboard_${{ needs.littlefs.outputs.safe_ref }}_esp32wrover.bin
            latestname: ESPSomfyRTS_onboard_esp32wrover.bin
          - env: esp32c3
            name: ESP32C3
            chip: ESP32-C3
            addr_bootloader: "0x0"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_esp32c3.bin
            obname: ESPSomfyRTS_onboard_${{ needs.littlefs.outputs.safe_ref }}_esp32c3.bin
            latestname: ESPSomfyRTS_onboard_esp32c3.bin
          - env: esp32s2
            name: ESP32S2
            chip: ESP32-S2
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_esp32s2.bin
            obname: ESPSomfyRTS_onboard_${{ needs.littlefs.outputs.safe_ref }}_esp32s2.bin
            latestname: ESPSomfyRTS_onboard_esp32s2.bin
          - env: esp32s3
            name: ESP32S3
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_littlefs: "0x770000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_esp32s3.bin
            obname: ESPSomfyRTS_onboard_${{ needs.littlefs.outputs.safe_ref }}_esp32s3.bin
            latestname: ESPSomfyRTS_onboard_esp32s3.bin

          # ---  LES DEUX BOX VENTE (4 Mo) ---
          - env: box_wifi
            name: BOX-Wifi
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_BOX_wifi_esp32.bin
            obname: ESPSomfyRTS_onboard_${{ needs.littlefs.outputs.safe_ref }}_BOX_wifi_esp32.bin
            latestname: ESPSomfyRTS_onboard_BOX_wifi_esp32.bin
          - env: box_eth
            name: BOX-Ethernet
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_littlefs: "0x370000"
            fwname: ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_BOX_eth_esp32.bin
            obname: ESPSomfyRTS_onboard_${{ needs.littlefs.outputs.safe_ref }}_BOX_eth_esp32.bin
            latestname: ESPSomfyRTS_onboard_BOX_eth_esp32.bin

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      # Récupère l'image LittleFS unique générée au Job 1
      - name: Get LittleFS
        uses: actions/download-artifact@v4
        with:
          name: LittleFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      # Sur une release, FW_VERSION est pris du tag pour s'identifier correctement
      - name: Inject release version into firmware
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          sed -i "s/#define FW_VERSION \"[^\"]*\"/#define FW_VERSION \"${TAG}\"/" src/ConfigSettings.h
          grep -n "FW_VERSION" src/ConfigSettings.h | head -1

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      # Création de l'image de fusion onboard (utilise l'offset LittleFS propre à chaque carte)
      - name: ${{ matrix.name }} Image
        run: |
          python -m esptool --chip ${{ matrix.chip }} \
            merge-bin -o .pio/build/${{ matrix.env }}/${{ matrix.obname }} \
            ${{ matrix.addr_bootloader }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin \
            ${{ matrix.addr_littlefs }} ESPSomfyRTS_${{ needs.littlefs.outputs.safe_ref }}_littlefs.bin

      # Compression de l'image onboard avec son nom d'archive propre
      - name: Compress onboard image
        run: zip -j .pio/build/${{ matrix.env }}/${{ matrix.obname }}.zip .pio/build/${{ matrix.env }}/${{ matrix.obname }}

      # CAS 1 : Si c'est un PUSH de dev
      - name: Upload ${{ matrix.name }} (Dev Artifact)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/${{ matrix.obname }}
          retention-days: 5

      # CAS 2 : Si c'est une RELEASE (Firmware applicatif)
      - name: Upload firmware to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.fwname }}
          asset_path: .pio/build/${{ matrix.env }}/firmware.bin
          overwrite: true

      # CAS 2 suite : Si c'est une RELEASE (Image zip d'usine)
      - name: Upload onboard image to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.obname }}.zip
          asset_path: .pio/build/${{ matrix.env }}/${{ matrix.obname }}.zip
          overwrite: true
          asset_content_type: application/zip

      # CAS 2 suite : alias à nom stable (sans le tag) de l'image onboard, NON zippé cette fois.
      # Sert exclusivement au wizard de flash web (docs/installer.html, ESP Web Tools) : celui-ci
      # ne peut ni dézipper un asset ni connaître à l'avance le tag de la dernière release, donc
      # ses manifestes pointent sur ce nom fixe via l'URL stable
      # /releases/latest/download/<latestname>, qui résout toujours vers la release publiée la
      # plus récente. `overwrite: true` republie cet alias à chaque nouvelle release, sans jamais
      # toucher aux assets versionnés ci-dessus (utilisés eux par GitOTA.cpp / les mises à jour
      # OTA classiques, qui ont besoin du binaire lié à une version précise).
      - name: Upload latest-alias onboard image (for web installer)
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.latestname }}
          asset_path: .pio/build/${{ matrix.env }}/${{ matrix.obname }}
          overwrite: true
