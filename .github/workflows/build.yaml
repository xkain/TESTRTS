name: ESPSomfy-RTS Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  # ==========================================
  # JOB 1 : Génère et uploade le LittleFS UNIQUE
  # ==========================================
  littlefs:
    permissions: write-all
    name: LittleFS
    runs-on: ubuntu-latest

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build LittleFS image (générique via esp32dev)
        run: pio run -e esp32dev -t buildfs

      - name: Rename LittleFS to Standard Name
        run: cp .pio/build/esp32dev/littlefs.bin SomfyController.littlefs.bin

      # Sauvegarde temporaire pour le job suivant (firmware)
      - name: Upload LittleFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleFS-Binary
          path: SomfyController.littlefs.bin
          retention-days: 1

      # Envoi de l'UNIQUE fichier binaire sur la page de release
      - name: Upload LittleFS to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: SomfyController.littlefs.bin
          asset_path: SomfyController.littlefs.bin
          overwrite: true

  # ==========================================
  # JOB 2 : Compile les firmwares pour chaque carte
  # ==========================================
  firmware:
    permissions: write-all
    name: ${{ matrix.name }}
    needs: [littlefs] # Attend que le LittleFS soit prêt
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32dev
            name: ESP32
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_fs: "0x290000"
            fwname: SomfyController.ino.esp32.bin
            obname: SomfyController.onboard.esp32.bin

          - env: esp32wrover
            name: ESP32-Wrover
            chip: ESP32
            addr_bootloader: "0x1000"
            addr_fs: "0x290000"
            fwname: SomfyController.ino.esp32wrover.bin
            obname: SomfyController.onboard.esp32wrover.bin

          - env: esp32c3
            name: ESP32C3
            chip: ESP32-C3
            addr_bootloader: "0x0"
            addr_fs: "0x290000"
            fwname: SomfyController.ino.esp32c3.bin
            obname: SomfyController.onboard.esp32c3.bin

          - env: esp32s2
            name: ESP32S2
            chip: ESP32-S2
            addr_bootloader: "0x1000"
            addr_fs: "0x290000"
            fwname: SomfyController.ino.esp32s2.bin
            obname: SomfyController.onboard.esp32s2.bin

          - env: esp32s3
            name: ESP32S3
            chip: ESP32-S3
            addr_bootloader: "0x0"
            addr_fs: "0x290000"
            fwname: SomfyController.ino.esp32s3.bin
            obname: SomfyController.onboard.esp32s3.bin

    steps:
      - name: Get Release info
        if: github.event_name == 'release'
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      # Récupération du LittleFS unique généré au JOB 1
      - name: Download LittleFS Artifact
        uses: actions/download-artifact@v4
        with:
          name: LittleFS-Binary

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: List build artifacts
        run: find .pio/build/${{ matrix.env }} -maxdepth 1 -name "*.bin" | sort

      # Fusion de l'image onboard avec l'unique SomfyController.littlefs.bin téléchargé
      - name: Create onboard image
        run: |
          python -m esptool --chip ${{ matrix.chip }} \
            merge-bin -o ${{ matrix.obname }} \
            ${{ matrix.addr_bootloader }} .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin \
            ${{ matrix.addr_fs }} SomfyController.littlefs.bin

      - name: Compress onboard image
        run: zip ${{ matrix.obname }}.zip ${{ matrix.obname }}

      - name: Upload artifacts (Tests de push)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/partitions.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            ${{ matrix.obname }}.zip
          retention-days: 5

      - name: Upload firmware to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.fwname }}
          asset_path: .pio/build/${{ matrix.env }}/firmware.bin
          overwrite: true

      - name: Upload onboard image to Release
        if: github.event_name == 'release'
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: ${{ matrix.obname }}.zip
          asset_path: ${{ matrix.obname }}.zip
          overwrite: true
          asset_content_type: application/zip
