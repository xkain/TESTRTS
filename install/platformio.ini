;
; Mode installation : programme minimal de la partition factory (cf. ../partitions_common_4mb.csv).
; Une image par famille de puce, quelle que soit la carte. Compilation : pio run -d install -e <puce>.
[platformio]
default_envs = esp32

[env]
platform = espressif32@6.8.1
framework = arduino
board_build.partitions = ../partitions_common_4mb.csv
board_build.app_partition_name = install
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
extra_scripts =
    pre:main_contract.py
    pre:../tools/check_install_contract.py
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -fno-exceptions
    -D NDEBUG

[env:esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D INSTALL_ETH=1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c6-devkitc-1
