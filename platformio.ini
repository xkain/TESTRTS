[platformio]
default_envs = esp32
#default_envs = box_wifi

[env]
platform = espressif32@6.8.1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8.0
    lsatan/SmartRC-CC1101-Driver-Lib @ 2.5.7
    esp32async/ESPAsyncWebServer @ 3.6.0
    esp32async/AsyncTCP @ 3.3.2
    links2004/WebSockets @ 2.7.2

extra_scripts =
    pre:tools/check_partition_layout.py
    pre:tools/check_config_layout.py
    pre:tools/lang/check_i18n.py
    pre:tools/build_data_image.py
    post:tools/check_image_header.py
board_build.filesystem = littlefs
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
build_flags =
    -D CORE_DEBUG_LEVEL=1
    # Désactive les exceptions C++ partout : ~110 Ko gagnés sur la partition app, pleine à l'octet
    # près. Aucun try/catch/throw dans le projet aujourd'hui -- à retirer AVANT d'en ajouter un,
    # pas après.
    -fno-exceptions
    # Pool WebSocket élargi (défaut lib = 5) : des connexions zombies (onglets rechargés, sondes
    # SSDP) épuisent vite le pool par défaut et font rejeter même des clients sains.
    -D WEBSOCKETS_SERVER_CLIENT_MAX=10
    # Timeout d'écriture WebSocket, réduit du défaut 5000ms (ce temps bloque loopTask, donc la RF
    # Somfy). NE PAS baisser sans le correctif de WResp.cpp (sendFrameFanOut) qui rattrape les
    # envois tronqués en dessous de ce délai.
    -D WEBSOCKETS_TCP_TIMEOUT=2000
    # Épingle async_tcp sur le cœur 0 pour ne pas préempter loopTask (RF Somfy bit-bangée) sur le
    # cœur 1. Sans effet tant qu'aucune route n'utilise ESPAsyncWebServer.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    # Pile async_tcp, posée à sa valeur par défaut (visible ici pour reportAsyncTcpStackLow()).
    # Marge mesurée ~3x le pic connu ; ne pas réduire avant d'avoir mesuré le chemin d'upload OTA,
    # seul non encore relevé.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=12288


# --- ENVIRONNEMENTS BOARDS (mes boîtiers assemblés) ---

[env:box_wifi]
board = esp32dev
board_build.partitions = partitions_common_4mb.csv
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOX_WIFI

[env:box_eth]
board = wt32-eth01
board_build.partitions = partitions_common_4mb.csv
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOX_ETH
    -D ENABLE_DEV_CORS


# --- ENVIRONNEMENTS ESP32 STANDARDS (4 Mo) ---

[env:esp32]
board = esp32dev
board_build.partitions = partitions_common_4mb.csv

# Variante dev, seule à activer ENABLE_DEV_CORS -- pour servir data-dev/ en cross-origin. Ne
# jamais publier de binaire issu de cet environnement.
[env:esp32_dev]
board = esp32dev
board_build.partitions = partitions_common_4mb.csv
build_flags =
    ${env.build_flags}
    -D ENABLE_DEV_CORS

[env:esp32wrover]
board = esp-wrover-kit
board_build.partitions = partitions_common_4mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = partitions_common_4mb.csv

[env:esp32s2]
board = esp32-s2-saola-1
board_build.partitions = partitions_common_4mb.csv

# ESP32-C6 -- chantier en cours, pas un environnement de release. Seul env hors espressif32@6.8.1
# (pas de support Arduino officiel sur C6), via le fork pioarduino, version épinglée.
#
# Piège : les deux plateformes partagent framework-arduinoespressif32, échangé à chaque
# alternance. Après un build core 2.x, `pio run -e esp32c6` échoue en quelques secondes
# (TypeError, FRAMEWORK_DIR vaut None) -- lancer `pio pkg install -e esp32c6` puis relancer.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32c6
# Table PROPRE au C6 : son binaire core 3.x occupait 92,3 % de la table commune, ce qui faisait de
# lui le plafond de tout le projet. +64 Ko par emplacement OTA pris sur le filesystem, qui n'accepte
# donc plus que DEUX packs de langue téléchargés au lieu de trois.
board_build.partitions = partitions_custom_c6_4mb.csv
build_flags =
    ${env.build_flags}
    -D FW_FS_VARIANT=\"c6\"

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_common_4mb.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
