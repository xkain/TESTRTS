[platformio]
default_envs = esp32
#default_envs = box_wifi

[env]
platform = espressif32@6.8.1
framework = arduino
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8.0
    lsatan/SmartRC-CC1101-Driver-Lib @ 2.5.7
    esp32async/ESPAsyncWebServer @ 3.6.0
    esp32async/AsyncTCP @ 3.3.2
    links2004/WebSockets @ 2.7.2

extra_scripts =
    pre:check_partition_layout.py
    pre:check_i18n.py
    pre:build_data_image.py
    post:check_image_header.py
board_build.filesystem = littlefs
monitor_speed = 115200
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB
build_flags =
    -D CORE_DEBUG_LEVEL=1
    # Désactive les exceptions C++ sur TOUT ce que nous compilons (nos sources et les
    # bibliothèques tirées depuis leurs sources). Le SDK Arduino livré, lui, est bâti avec
    # CONFIG_COMPILER_CXX_EXCEPTIONS=y : la machinerie est donc présente par défaut et chaque unité
    # de compilation ajoutée paie sa part. Ce que le compilateur cesse d'émettre, ce n'est pas le
    # code des try/catch -- c'est la table de dépliage de pile produite pour CHAQUE fonction, qu'elle
    # puisse lever une exception ou non : un impôt proportionnel au volume de C++ compilé, pas à
    # l'usage qu'on en fait. Gain mesuré sur esp32wrover, rebuild complet des deux côtés :
    # 1 492 449 -> 1 381 777 octets, soit 110 672 octets (84,3 % -> 78,1 % de la partition app).
    # RAM inchangée.
    # Sans effet sur le comportement observable AUJOURD'HUI : il n'y a aucun throw, catch ni try
    # dans src/ ni dans les six bibliothèques de lib_deps (vérifié), et une exception non attrapée
    # appelle de toute façon std::terminate() puis abort(), donc redémarrage -- exactement ce que
    # produit ce drapeau. Idem pour les 4 `new` du projet : bad_alloc non attrapé redémarre déjà.
    # CE QUE CE DRAPEAU COÛTE EST UNE CONTRAINTE FUTURE, PAS UN RISQUE PRÉSENT. try/catch/throw
    # deviennent des erreurs de compilation. Si une piste exige un jour d'entourer une allocation
    # d'un catch(std::bad_alloc) -- typiquement en reprenant l'enquête sur la famine de tas en OTA --
    # alors il faut D'ABORD retirer cette ligne, et donc rendre 110 672 octets à une partition
    # applicative qui repasserait à 84 %. Vérifier ce budget AVANT de concevoir une solution
    # à base d'exceptions, pas après : la table de partitions est pleine à l'octet près et ne peut
    # pas absorber ce retour. Une approche sans exceptions (retour d'erreur, vérification de
    # nullité) évite entièrement l'arbitrage.
    -fno-exceptions
    # WEBSOCKETS_SERVER_CLIENT_MAX par défaut (links2004/WebSockets) = 5 -- juste un tableau
    # WSclient_t[N] statique dans WebSocketsServerCore (~90 octets/emplacement, cf.
    # WebSocketsServer.h), aucune autre limite matérielle ne l'impose. 5 s'épuise vite dès qu'un
    # client (page rechargée plusieurs fois, sonde de découverte Home Assistant/SSDP qui rouvre
    # sans fermer proprement l'ancienne...) laisse des connexions zombies traîner jusqu'à
    # expiration du heartbeat (~50s, cf. Sockets.cpp SocketEmitter::begin()) : la moindre rafale
    # sature alors TOUT le pool et fait rejeter (TCP RST) même un client complètement différent.
    # Un correctif d'éviction applicatif avait été tenté deux fois (30/07/2026 par IP inconditionnelle
    # -- revert fdeb8d0, régressait sur le multi-onglet -- puis seulement à pool plein -- créait une
    # oscillation sans fin entre 2 emplacements sans jamais atteindre les zombies plus anciens) ;
    # les deux abandonnés. Élargir le pool est plus direct : ~450 octets de RAM statique
    # supplémentaires (10 emplacements au lieu de 5, sur 320 Ko de RAM totale) contre une bien plus
    # grande marge avant épuisement, sans toucher au heartbeat ni à la logique de reconnexion.
    -D WEBSOCKETS_SERVER_CLIENT_MAX=10
    # Durée maximale de l'attente ACTIVE de WebSockets::write() (links2004) sur un client qui ne
    # libère pas sa fenêtre TCP. Défaut bibliothèque : 5000 ms. C'est du temps volé à la tâche
    # PRINCIPALE, la seule à parler à sockServer depuis le découplage d'async_tcp -- donc à la RF
    # Somfy, à la planification et au suivi de position, gelés d'autant.
    # 2000 : une trame fait au plus 2 Ko, qui partent en quelques millisecondes sur un réseau local
    # sain ; au-delà de 2 s le client est réellement parti (navigateur fermé, portable en veille).
    # On garde ~200x la marge du cas nominal pour ne pas pénaliser un client simplement congestionné.
    # NE PAS baisser cette valeur sans le correctif qui l'accompagne (sendFrameFanOut dans
    # WResp.cpp) : un dépassement fait partir la trame TRONQUÉE et désynchronise le flux du client.
    # C'est ce correctif qui détecte l'échec et, après SOCK_WRITE_FAIL_LIMIT échecs CONSÉCUTIFS,
    # déconnecte proprement. Les deux valeurs forment un tout : ce délai borne la durée d'un
    # blocage, le seuil d'échecs évite qu'un délai plus court ne devienne une machine à déconnecter.
    -D WEBSOCKETS_TCP_TIMEOUT=2000
    # Préparation migration ESPAsyncWebServer (étape 1d de l'audit de concurrence) : loopTask (RF
    # Somfy bit-bangée en delayMicroseconds(), sans section critique) est épinglée par le framework
    # Arduino sur le cœur 1 (CONFIG_ARDUINO_RUNNING_CORE=1, cf. esp32-hal.h). La tâche async_tcp
    # d'AsyncTCP tourne par défaut à la priorité 10 (CONFIG_ASYNC_TCP_PRIORITY, cf. AsyncTCP.h) --
    # bien au-dessus des 1 de loopTask -- sans affinité de cœur fixée (-1 = n'importe lequel), ce
    # qui l'autorise à préempter loopTask EN PLEIN MILIEU d'une émission RF si elle est ordonnancée
    # sur le cœur 1. On la force explicitement sur le cœur 0 pour éviter cette préemption directe
    # (le risque d'interférence inter-cœurs via bus/interruptions partagés subsiste, mais devient
    # un problème de contention, pas de préemption directe du même cœur). N'a aucun effet tant
    # qu'aucune route n'est migrée vers ESPAsyncWebServer (AsyncTCP ne démarre sa tâche qu'au
    # premier AsyncWebServer::begin()) -- flag sûr à poser dès maintenant.
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    # Taille de pile de la tâche async_tcp. Posée explicitement À SA VALEUR PAR DÉFAUT (AsyncTCP.h
    # définit 8192*2 sous #ifndef) pour deux raisons : rendre la macro visible depuis notre code --
    # ConfigSettings::reportAsyncTcpStackLow() l'affiche comme dénominateur, et sans define elle
    # rapporterait un total faux -- et faire de sa réduction future une modification d'un seul
    # nombre, à un endroit documenté.
    # Ces 16 Ko sont alloués SUR LE TAS, en un bloc, dès le premier AsyncWebServer::begin() et pour
    # toute la vie de l'appareil : c'est le plus gros consommateur unique introduit par la migration
    # ESPAsyncWebServer, et il pèse directement sur ESP.getMaxAllocHeap(). Les relevés de
    # high-water-mark en usage courant (UI, OTA) donnent un pic réel d'environ 3,4 Ko, soit 23 %
    # d'utilisation -- mais un débordement de pile serait bien plus grave qu'un refus propre de
    # connexion TLS, donc on ne descend qu'après avoir mesuré les chemins les PLUS PROFONDS
    # d'async_tcp. Relevés obtenus sur matériel via reportAsyncTcpStackLow(), qui nomme le chemin à
    # chaque nouveau minimum : /controller bufferisé 3460, /controller chunked 3444-3460, /scanaps
    # 3540. Trois chemins très différents (scan WiFi, sérialisation, callback de réponse chunked)
    # convergent vers 3,4-3,5 Ko, ce qui indique une profondeur dominée par la bibliothèque
    # elle-même plutôt que par nos handlers.
    # 12288 retenu plutôt que 8192 : le chemin d'UPLOAD n'a pas encore été mesuré, et c'est le seul
    # qui descende dans Update.write() puis le pilote flash. Un débordement de pile pendant
    # l'écriture d'une partition OTA serait la pire défaillance du lot, alors que les 4 Ko d'écart
    # entre les deux valeurs ne changent rien de décisif. Passer à 8192 (marge encore 2,3x le pic
    # connu) une fois qu'un /restore ou une mise à jour firmware aura été relevé sans nouveau
    # minimum. Marge actuelle : 12288 - 3540 = 8748 octets, soit 3,5x le pic mesuré.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=12288


# --- ENVIRONNEMENTS BOARDS PROPRES À TON MATÉRIEL ---

# ENABLE_DEV_CORS ne doit JAMAIS figurer dans un environnement de release, y compris celui-ci
# (boîtiers assemblés) : ce flag pose Access-Control-Allow-Origin/Methods/Headers à "*" sur TOUTE
# l'API (cf. Web::begin()), donc n'importe quel site web visité par l'utilisateur peut lire et
# écrire la configuration du boîtier depuis son navigateur -- et récupérer la passphrase Wi-Fi via
# /scanaps tant que la sécurité est sur None (défaut d'usine). Pour développer data-dev/ depuis une
# origine distincte, utiliser [env:esp32_dev] ci-dessous.
[env:box_wifi]
board = esp32dev
board_build.partitions = partitions_custom4mb.csv
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOX_WIFI

[env:box_eth]
board = wt32-eth01
board_build.partitions = partitions_custom4mb.csv
build_flags =
    ${env.build_flags}
    -D HARDWARE_BOX_ETH


# --- ENVIRONNEMENTS ESP32 STANDARDS (4 Mo) ---

# Environnement de RELEASE de l'ESP32 générique (le suffixe "dev" de `board = esp32dev` désigne la
# carte DevKit chez PlatformIO, pas un profil de développement -- d'où le nom d'environnement court,
# pour qu'aucune confusion ne subsiste avec [env:esp32_dev] juste en dessous). C'est cet
# environnement que build.yaml compile et publie, et dont le job "littlefs" tire le filesystem
# générique (langue "en" embarquée).
[env:esp32]
board = esp32dev
board_build.partitions = partitions_custom4mb.csv

# Variante de DÉVELOPPEMENT d'esp32, et le SEUL environnement qui active ENABLE_DEV_CORS.
# À n'utiliser que pour servir data-dev/ depuis une origine distincte du device (ex.
# http://localhost:8000) : le flag ouvre toute l'API en cross-origin, cf. le commentaire de
# [env:box_wifi], et neutralise le contrôle d'origine du port 8082 (cf. WebGitSync.cpp).
# Ne jamais publier de binaire issu de cet environnement.
[env:esp32_dev]
board = esp32dev
board_build.partitions = partitions_custom4mb.csv
build_flags =
    ${env.build_flags}
    -D ENABLE_DEV_CORS

[env:esp32wrover]
board = esp-wrover-kit
board_build.partitions = partitions_custom4mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.partitions = partitions_custom4mb.csv

[env:esp32s2]
board = esp32-s2-saola-1
board_build.partitions = partitions_custom4mb.csv

# ESP32-C6 -- chantier en cours, PAS un environnement de release.
#
# Seul environnement du projet à quitter espressif32@6.8.1 : la plateforme PlatformIO officielle
# n'a jamais porté Arduino sur C6, à aucune version (vérifié jusqu'à la 7.1.3, qui ne propose que
# le framework espidf pour cette puce). La seule voie est le fork communautaire pioarduino, qui
# apporte Arduino core 3.x / IDF 5.x. Les huit autres environnements restent donc en core 2.0.17 :
# le code doit compiler sur les deux, c'est ce que le chantier de portabilité a préparé.
#
# Version épinglée explicitement plutôt que suivie : un changement de socle sous un chantier en
# cours rendrait toute régression indébrouillable.
#
# PIÈGE DE BUILD, à connaître avant de perdre une heure dessus. Les deux plateformes se partagent
# le répertoire de paquet `framework-arduinoespressif32` et PlatformIO l'échange à chaque
# alternance. Après un build d'un environnement core 2.x, un `pio run -e esp32c6` échoue en une
# poignée de secondes sur un `TypeError` dans pathlib (FRAMEWORK_DIR vaut None) -- ce n'est pas une
# erreur de code, c'est le paquet resté sur la mauvaise version. Le remède :
#
#     pio pkg install -e esp32c6
#
# puis relancer le build. Reproductible dans les deux sens ; c'est le coût réel du double socle.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
# Seeed Studio XIAO ESP32C6 -- la carte réellement disponible pour éprouver ce socle, et non un
# devkit générique : c'est elle qui fixe le brochage radio par défaut (cf. transceiver_config_t::
# load()). 4 Mo de flash, et ARDUINO_USB_CDC_ON_BOOT=1 dans sa définition, donc la console série
# sort par l'USB natif sans montage particulier.
board = seeed_xiao_esp32c6
board_build.partitions = partitions_custom4mb.csv

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions_custom4mb.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
